name: reclaim_mobile

description: Enforced focus mode mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.2
  fl_chart: ^0.70.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  share_plus: any
  path_provider: ^2.1.5
  firebase_core: any
  firebase_messaging: any
  firebase_auth: any
  google_sign_in: ^6.2.1
  flutter_secure_storage: any
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

